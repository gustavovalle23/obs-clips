<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melhores Momentos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #player {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #player iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
    }

    #controls {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #container:hover #controls {
      opacity: 1;
    }

    button {
      border: 0;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.75);
      color: white;
    }

    button:hover {
      background: rgba(30, 30, 30, 0.9);
    }

    #status {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 10;
      padding: 8px 12px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 5px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #status.visible {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="container">
    <div id="player"></div>

    <div id="controls">
      <button id="playPauseBtn">Pausar</button>
      <button id="nextBtn">Próximo</button>
    </div>

    <div id="status">Carregando...</div>
  </div>

  <script>
    const videos = [
      "j9bDfDLCtow",
      "i-QhoQGrPL0"
    ];

    let player;
    let queue = [];
    let lastVideo = null;
    let changingVideo = false;

    const statusElement = document.getElementById("status");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const nextBtn = document.getElementById("nextBtn");

    function shuffleVideos() {
      queue = [...videos];

      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }

      if (
        queue.length > 1 &&
        lastVideo !== null &&
        queue[0] === lastVideo
      ) {
        [queue[0], queue[1]] = [queue[1], queue[0]];
      }
    }

    function getNextVideo() {
      if (queue.length === 0) {
        shuffleVideos();
      }

      const video = queue.shift();
      lastVideo = video;

      return video;
    }

    function playNextVideo() {
      if (!player || changingVideo) {
        return;
      }

      changingVideo = true;

      const videoId = getNextVideo();

      player.loadVideoById({
        videoId: videoId,
        startSeconds: 0
      });

      setTimeout(() => {
        changingVideo = false;
      }, 1000);
    }

    function showStatus(text) {
      statusElement.textContent = text;
      statusElement.classList.add("visible");
    }

    function hideStatus() {
      statusElement.classList.remove("visible");
    }

    function updatePlayPauseButton() {
      if (!player) {
        return;
      }

      const state = player.getPlayerState();

      if (state === YT.PlayerState.PLAYING) {
        playPauseBtn.textContent = "Pausar";
      } else {
        playPauseBtn.textContent = "Reproduzir";
      }
    }

    function togglePlayPause() {
      if (!player) {
        return;
      }

      const state = player.getPlayerState();

      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }

      setTimeout(updatePlayPauseButton, 100);
    }

    function onYouTubeIframeAPIReady() {
      shuffleVideos();

      const firstVideo = getNextVideo();

      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        videoId: firstVideo,
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0,
          playsinline: 1,
          iv_load_policy: 3,
          cc_load_policy: 0
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      event.target.setVolume(100);
      event.target.unMute();
      event.target.playVideo();
      updatePlayPauseButton();
      hideStatus();
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.PLAYING) {
        changingVideo = false;
        hideStatus();
      }

      if (event.data === YT.PlayerState.ENDED) {
        changingVideo = false;
        playNextVideo();
      }

      updatePlayPauseButton();
    }

    function onPlayerError() {
      changingVideo = false;
      showStatus("Pulando vídeo...");
      setTimeout(playNextVideo, 1500);
    }

    playPauseBtn.addEventListener("click", togglePlayPause);

    nextBtn.addEventListener("click", () => {
      changingVideo = false;
      playNextVideo();
    });

    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  </script>
</body>
</html>
