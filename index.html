<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melhores Momentos</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    #clip-container {
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>
  <div id="clip-container"></div>

  <script>
    const clips = [
      "FaintAltruisticCamelPeoplesChamp-qE-vTkuetzIj-tTK",
      "MuddySeductiveAsteriskNotLikeThis-IXKEeSHoNefllkUe"
    ];

    const parentDomain = "seudominio.com";

    const clipDuration = 30000;

    let queue = [];

    function shuffleClips() {
      queue = [...clips];

      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
    }

    function playClip() {
      if (queue.length === 0) {
        shuffleClips();
      }

      const clip = queue.shift();

      document.getElementById("clip-container").innerHTML = `
        <iframe
          src="https://clips.twitch.tv/embed?clip=${clip}&parent=${parentDomain}&autoplay=true"
          allow="autoplay; fullscreen"
          allowfullscreen>
        </iframe>
      `;
    }

    shuffleClips();

    playClip();

    setInterval(playClip, clipDuration);
  </script>
</body>
</html>
